[package]
name = "kueueski"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast command-line client for BullMQ queues"
license = "MIT"
homepage = "https://github.com/kevinloo/kueueski"
repository = "https://github.com/kevinloo/kueueski"
keywords = ["bullmq", "redis", "queue", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
bullmq-official = "1.1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
